<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zhao Yuxin's portfolio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="loginView" class="auth" hidden>
        <form id="loginForm" class="auth-panel" autocomplete="off">
          <p class="eyebrow">Private Access</p>
          <h1>Zhao Yuxin's portfolio</h1>
          <label for="password">访问密码</label>
          <div class="password-row">
            <input id="password" name="password" type="password" required autofocus placeholder="Enter password" />
            <button type="submit">进入</button>
          </div>
          <p id="loginMessage" class="message" role="status"></p>
        </form>
      </section>

      <section id="expiredView" class="empty" hidden>
        <p class="eyebrow">Expired</p>
        <h1>这个作品集链接已失效</h1>
      </section>

      <section id="galleryView" hidden>
        <header class="topbar">
          <div>
            <p class="eyebrow">Portfolio</p>
            <h1>作品集预览</h1>
          </div>
          <button id="logoutButton" class="ghost" type="button">退出</button>
        </header>

        <div id="gallery" class="masonry" aria-live="polite"></div>
        <div id="emptyState" class="empty" hidden>
          <p class="eyebrow">No Images</p>
          <h1>把图片放进 portfolio-images 文件夹</h1>
        </div>
      </section>
    </main>

    <dialog id="lightbox" class="lightbox">
      <button id="closeLightbox" class="close" type="button" aria-label="关闭">×</button>
      <button id="prevImage" class="nav nav-left" type="button" aria-label="上一张">‹</button>
      <img id="lightboxImage" alt="" />
      <button id="nextImage" class="nav nav-right" type="button" aria-label="下一张">›</button>
      <p id="caption" class="caption"></p>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
